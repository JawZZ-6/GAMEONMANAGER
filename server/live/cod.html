document.addEventListener('focusout', () => setTimeout(() => { if (paintLater && !editing()) paint(); }, 0));

let NET = 'live', syncT = 0, syncing = false, retry = 0;
function setNet(s){
  if (s) NET = s;
  const label = {live:EDIT ? 'Signed in as organiser · results save to GameON for everyone' : 'Live · results update automatically', saving:'Saving…', retry:'Not saved yet · retrying', off:'Reconnecting to live results…'}[NET];
  $('foot').innerHTML = `<span class="net ${NET === 'live' || NET === 'saving' ? '' : 'off'}"><i></i>${esc(label)}</span>${EDIT ? '' : ' · <a href="/live/rules">Event rules</a>'}`;
}
function queueSync(){ if (!EDIT) return; clearTimeout(syncT); syncT = setTimeout(sync, 400); }
async function sync(){
  if (syncing){ queueSync(); return; }
  const changes = pending();
  if (!changes.length){ if (NET !== 'off') setNet('live'); return; }
  syncing = true; setNet('saving');
  try {
    const res = await fetch('/api/cod', {method:'POST', credentials:'same-origin', headers:{'Content-Type':'application/json'}, body:JSON.stringify({changes})});
    if (res.status === 401) return signedOut();
    const body = await res.json().catch(() => ({}));
    if (res.status >= 400 && res.status < 500 && res.status !== 429){
      // The server refused these values, so retrying cannot help: go back to what is saved.
      S = Object.assign(clone(BASE), {track:S.track}); paint();
      toast(body.error || 'That change could not be saved', true); setNet('live'); return;
    }
    if (!res.ok) throw new Error(body.error || 'Save failed');
    retry = 0; adopt(body); setNet('live'); paint();
  } catch(err){
    retry = Math.min(retry + 1, 5); setNet('retry');
    clearTimeout(syncT); syncT = setTimeout(sync, 1000 * 2 ** retry);
  } finally { syncing = false; }
}
function signedOut(){
  EDIT = false; S = Object.assign(clone(BASE), {track:S.track});
  document.documentElement.classList.add('ro'); setNet('live'); closeModal(false); render(true);
  openModal({title:'Organiser session ended', icon:'lock', tone:'danger', sub:'Changes you had not saved yet were discarded. Sign in again to keep scoring.', actions:[{label:'Stay read-only'}, {label:'Sign in', cls:'primary', icon:'arrow', focus:true, fn:() => { location.href = '/admin'; }}]});
}
function fromServer(cod){
  if (!cod || eq(pick(cod), BASE)) return;
  adopt(cod); paint();
}
let pollT = 0, streamOk = false;
function poll(){
  clearTimeout(pollT);
  fetch('/api/cod', {cache:'no-store'}).then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(c => { fromServer(c); if (!streamOk && NET === 'off') setNet('live'); })
    .catch(() => { if (!streamOk) setNet('off'); })
    .finally(() => { pollT = setTimeout(poll, streamOk ? 30000 : 8000); });
}
function listen(){
  if (typeof EventSource === 'undefined'){ poll(); return; }
  const es = new EventSource('/api/live/stream');
  es.onmessage = e => { streamOk = true; if (NET === 'off') setNet('live'); try { fromServer(JSON.parse(e.data).cod); } catch(err) {} };
  es.onerror = () => {
    streamOk = false; setNet('off');
    // A closed stream (server busy or restarting) does not reconnect on its own: poll, then try again.
    if (es.readyState === 2){ setTimeout(listen, 60000); }
  };
  clearTimeout(pollT); pollT = setTimeout(poll, 30000);
}

/* ---------------- Events ---------------- */
document.addEventListener('click', e => {
  const opt = e.target.closest('.opt');
  if (opt && POP){ pickPop(+opt.dataset.i); return; }
  const t = e.target.closest('[data-act]'); if (!t) return;
  const act = t.dataset.act, id = t.dataset.id, n = t.dataset.n;
  if (!EDIT && WRITES.has(act)) return;
  if (act === 'pl'){
    snap(id);
    const v = +t.dataset.v, r = S.r[id] = S.r[id] || {};
    r.pl = r.pl || {}; r.k = r.k || {}; delete r.ff; delete r.s;
    const was = r.pl[n], E = ents(id);
    if (was === v) delete r.pl[n];
    else {
      if (v > 0){ const other = Object.keys(r.pl).find(x => x !== n && r.pl[x] === v && E.includes(x)); if (other){ if (was > 0) r.pl[other] = was; else delete r.pl[other]; } }
      r.pl[n] = v;
    }
    save(); render(true); report();
  }
  else if (act === 'clear'){
    const has = done(id);
    const go = () => { snap(id); delete S.r[id]; save(); render(true); PRE = {}; toast(`${short(id) === id ? id : 'Final'} result cleared`); };
    if (!has) go();
    else openModal({title:`Clear ${MI[id].final ? 'the Final' : id}?`, icon:'reset', tone:'danger', sub:'This removes the places, kills or scores entered for this match.', actions:[{label:'Keep it', focus:true}, {label:'Clear result', cls:'danger', icon:'reset', fn:go}]});
  }
  else if (act === 'ff'){ ffModal(id); }
  else if (act === 'lock'){ const F = finalists(t.dataset.ev); S.fin = S.fin || {}; S.fin[t.dataset.ev] = F.names.slice(); commit(`${t.dataset.ev === 'ch' ? 'Play-in line-up' : 'Finalists'} locked: ${F.names.map(x => t.dataset.ev === 'ffa' ? first(x) : tShort(x)).join(', ')}`); }
  else if (act === 'unlock'){ delete S.fin[t.dataset.ev]; commit('Finalists unlocked. They follow the table again.'); }
  else if (act === 'f'){ UI.f = t.dataset.f; render(true); }
  else if (act === 'day'){ UI.day = t.dataset.d; render(true); }
  else if (act === 'sev'){ UI.sev = t.dataset.v; render(true); }
  else if (act === 'hide'){ UI.hideDone = !UI.hideDone; render(true); }
  else if (act === 'clr'){ const inp = $(t.dataset.for); inp.value = ''; inp.dispatchEvent(new Event('input', {bubbles:true})); inp.focus(); }
  else if (act === 'theme'){ setTheme(curTheme() === 'dark' ? 'light' : 'dark'); }
  else if (act === 'menu'){ toggleMenu(); }
  else if (act === 'anim'){ PREF.anim = !PREF.anim; savePref(); applyAnim(); t.setAttribute('aria-checked', String(PREF.anim)); }
  else if (act === 'trackp'){ setTrack(trackHit(n) ? '' : n); }
  else if (act === 'untrack'){ setTrack(''); }
  else if (act === 'pmodal'){ playerModal(n); }
  else if (act === 'modal-x'){ closeModal(t.tagName !== 'A'); }
  else if (act === 'modal-a'){ const a = MODAL && MODAL.actions[+t.dataset.i]; if (a && a.fn) a.fn(); closeModal(); }
  else if (act === 'rules'){ toggleMenu(false); rulesModal(); }
  else if (act === 'copy'){
    toggleMenu(false);
    const txt = standingsText();
    const fallback = () => openModal({title:'Copy standings', icon:'copy', sub:'Select the text below and copy it.', html:`<textarea class="cpt" readonly>${esc(txt)}</textarea>`, actions:[{label:'Close', cls:'primary', focus:true}]});
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(() => toast('Standings copied. Paste them anywhere.'), fallback);
    else fallback();
  }
  else if (act === 'export'){
    toggleMenu(false);
    const blob = new Blob([JSON.stringify({app:'cod-tracker-26', exported:new Date().toISOString(), r:S.r, fin:S.fin, rules:S.rules}, null, 2)], {type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'cod-results.json'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    toast('Results exported');
  }
  else if (act === 'import'){ toggleMenu(false); $('importIn').click(); }
  else if (act === 'reset'){
    toggleMenu(false);
    const c = Object.keys(S.r).length;
    openModal({title:'Reset all results?', icon:'alert', tone:'danger', sub:c ? `This clears ${plural(c, 'match result')} and any locked finalists for everyone watching the live board. Your scoring rules stay.` : 'There are no results recorded yet.',
      html:c ? 'Export a backup first if you might want them back.' : '',
      actions:c ? [{label:'Keep results', focus:true}, {label:'Reset everything', cls:'danger', icon:'reset', fn:() => { S.r = {}; S.fin = {}; commit('All results cleared'); }}] : [{label:'Close', cls:'primary'}]});
  }
});
document.addEventListener('pointerdown', e => {
  if (POP && !popEl.contains(e.target) && !$('spot').contains(e.target)) closePop();
  if (!menuEl.hidden && !menuEl.contains(e.target) && !menuBtn.contains(e.target)) toggleMenu(false);
}, true);
popEl.addEventListener('pointerdown', e => e.preventDefault());
popEl.addEventListener('mousemove', e => { const o = e.target.closest('.opt'); if (o && POP && +o.dataset.i !== POP.idx){ POP.idx = +o.dataset.i; popEl.querySelectorAll('.opt.act').forEach(x => x.classList.remove('act')); o.classList.add('act'); spotIn.setAttribute('aria-activedescendant', o.id); } });
document.addEventListener('input', e => {
  const t = e.target;
  if ((t.dataset.k || t.dataset.s) && !EDIT) return;
  if (t.dataset.k){
    const id = t.dataset.k; snap(id);
    const r = S.r[id] = S.r[id] || {}; r.k = r.k || {}; r.pl = r.pl || {}; delete r.ff; delete r.s;
    if (t.value === '') delete r.k[t.dataset.n]; else r.k[t.dataset.n] = Math.max(0, Math.min(999, Math.round(+t.value) || 0));
    save();
  } else if (t.dataset.s){
    const id = t.dataset.s; snap(id);
    const r = S.r[id] = S.r[id] || {}; r.s = r.s || [null, null]; delete r.ff;
    r.s[+t.dataset.i] = t.value === '' ? null : Math.max(0, Math.min(999, Math.round(+t.value) || 0));
    if (r.s[0] == null && r.s[1] == null) delete S.r[id];
    save();
  } else if (t.id === 'pq'){ UI.pq = t.value; $('plList').innerHTML = playerList(); }
  else if (t.id === 'spotIn'){ openSpot(); }
});
document.addEventListener('change', e => { if (e.target.dataset.k || e.target.dataset.s) soon(); });
spotIn.addEventListener('focus', () => { if (S.track) spotIn.select(); openSpot(); });
spotIn.addEventListener('blur', () => setTimeout(() => { if (document.activeElement !== spotIn){ closePop(); syncSpot(); } }, 120));
$('importIn').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f || !EDIT) return;
  const fr = new FileReader();
  fr.onload = () => {
    try { const j = JSON.parse(fr.result); if (!j || typeof j.r !== 'object' || j.r === null) throw 0; S.r = j.r; S.fin = j.fin || {}; if (j.rules) S.rules = j.rules; commit('Results imported'); }
    catch(err){ openModal({title:'That file did not work', icon:'alert', tone:'danger', sub:'It is not a COD results export. Pick the .json file made by Export results.', actions:[{label:'OK', cls:'primary'}]}); }
    e.target.value = '';
  };
  fr.readAsText(f);
});
document.addEventListener('keydown', e => {
  const t = e.target, k = e.key;
  if (MODAL){
    if (k === 'Escape'){ e.preventDefault(); closeModal(); return; }
    if (k === 'Enter' && t.matches && t.matches('.rules input')){ e.preventDefault(); const b = $('modal').querySelector('.btn.primary'); if (b) b.click(); return; }
    if (k === 'Tab'){
      const f = [...$('modal').querySelectorAll('button,a[href],input,textarea')].filter(x => !x.disabled);
      if (!f.length) return;
      const i = f.indexOf(document.activeElement);
      if (e.shiftKey && i <= 0){ e.preventDefault(); f[f.length-1].focus(); }
      else if (!e.shiftKey && (i === f.length-1 || i === -1)){ e.preventDefault(); f[0].focus(); }
    }
    return;
  }
  if (t === spotIn){
    if (k === 'ArrowDown'){ e.preventDefault(); if (!POP) openSpot(); else movePop(1); }
    else if (k === 'ArrowUp'){ e.preventDefault(); movePop(-1); }
    else if (k === 'Enter'){ e.preventDefault(); if (POP) pickPop(POP.idx); }
    else if (k === 'Escape'){ e.preventDefault(); closePop(); spotIn.blur(); }
    return;
  }
  if (t.matches && t.matches('input[data-k],input[data-s]') && k === 'Enter'){ e.preventDefault(); t.blur(); return; }
  if (!menuEl.hidden){
    const items = [...menuEl.querySelectorAll('.mi')], i = items.indexOf(document.activeElement);
    if (k === 'Escape'){ e.preventDefault(); toggleMenu(false, true); return; }
    if (k === 'ArrowDown'){ e.preventDefault(); items[(i+1) % items.length].focus(); return; }
    if (k === 'ArrowUp'){ e.preventDefault(); items[(i-1+items.length) % items.length].focus(); return; }
    if (k === 'Tab'){ toggleMenu(false); }
  } else if (t === menuBtn && k === 'ArrowDown'){ e.preventDefault(); toggleMenu(true); requestAnimationFrame(() => menuEl.querySelector('.mi').focus()); return; }
  const typing = t.matches && t.matches('input,textarea,[contenteditable]');
  if ((k === '/' && !typing) || (k.toLowerCase() === 'k' && (e.ctrlKey || e.metaKey))){ e.preventDefault(); spotIn.focus(); }
});

/* theme & prefs */
const curTheme = () => document.documentElement.dataset.theme === 'light' ? 'light' : 'dark';
function paintTheme(){
  const dark = curTheme() === 'dark', b = $('themeBtn');
  b.innerHTML = ic(dark ? 'sun' : 'moon');
  b.setAttribute('aria-label', dark ? 'Switch to light theme' : 'Switch to dark theme');
  document.querySelector('meta[name="theme-color"]').content = dark ? '#07070C' : '#EEF0FF';
}
function setTheme(t){
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem('cod26-theme', t); } catch(e) {}
  paintTheme();
}
const applyAnim = () => document.documentElement.classList.toggle('still', !PREF.anim);
try { const t = localStorage.getItem('cod26-theme'); if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t; } catch(e) {}
paintTheme(); applyAnim();

let rz; window.addEventListener('resize', () => { cancelAnimationFrame(rz); rz = requestAnimationFrame(() => { toggleMenu(false); placePop(); }); });
window.addEventListener('hashchange', () => { closeModal(false); toggleMenu(false); closePop(); render(false); });
document.documentElement.classList.toggle('ro', !EDIT);
setNet('live'); render(false); listen();
</script>
