<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>COD Showdown · Live scores</title>
<meta name="description" content="Score tracker for the COD Free-for-All and COD 2v2 events, Game on for Charity, Nov 16–27, 2026.">
<meta name="theme-color" content="#07070C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Dark is the default: it matches the dark banner art. Light is opt-in from the theme button. */
:root{
  --bg-a:#07070C; --bg-b:#0E0B19; --bg-c:#080C13;
  --orb1:rgba(124,58,237,.30); --orb2:rgba(6,182,212,.17); --orb3:rgba(239,161,84,.13); --gridc:rgba(255,255,255,.03);
  --glass:rgba(255,255,255,.06); --glass-2:rgba(255,255,255,.105); --glass-pop:rgba(20,18,34,.9); --sunk:rgba(0,0,0,.24);
  --stroke:rgba(255,255,255,.11); --stroke-2:rgba(255,255,255,.24); --hi:inset 0 1px 0 rgba(255,255,255,.10);
  --fg:#F2F3FB; --muted:#AEB3CB;
  --primary:#B79CFF; --grad:linear-gradient(135deg,#8B5CF6,#D946EF 55%,#FB7185); --on-primary:#FFFFFF;
  --ok:#4ADE80; --on-ok:#052E14; --ok-bg:rgba(74,222,128,.13); --warn:#FBBF24; --warn-bg:rgba(251,191,36,.13);
  --accent:#FB7185; --on-accent:#2A0610; --track:#FDBA74; --track-bg:rgba(251,146,60,.15); --gold:#FCD34D; --gold-bg:rgba(252,211,77,.12);
  --c-console:#B79CFF; --c-pc:#4FD8F0; --c-board:#FBC548; --c-party:#FF8A9B;
  --shadow:0 1px 1px rgba(0,0,0,.3),0 18px 44px -20px rgba(0,0,0,.75);
  --shadow-pop:0 34px 90px -20px rgba(0,0,0,.85);
  --scrim:rgba(4,4,14,.62);
  --r:20px; --r-sm:14px;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg-a:#EEF0FF; --bg-b:#F8EEFF; --bg-c:#E6F6FF;
  --orb1:rgba(167,139,250,.60); --orb2:rgba(103,232,249,.52); --orb3:rgba(253,164,175,.55); --gridc:rgba(70,60,130,.055);
  --glass:rgba(255,255,255,.56); --glass-2:rgba(255,255,255,.76); --glass-pop:rgba(255,255,255,.88); --sunk:rgba(70,60,130,.07);
  --stroke:rgba(70,60,130,.14); --stroke-2:rgba(70,60,130,.28); --hi:inset 0 1px 0 rgba(255,255,255,.95);
  --fg:#15132B; --muted:#55526F;
  --primary:#6D28D9; --grad:linear-gradient(135deg,#7C3AED,#C026D3 55%,#E11D48); --on-primary:#FFFFFF;
  --ok:#15803D; --on-ok:#FFFFFF; --ok-bg:rgba(22,163,74,.13); --warn:#B45309; --warn-bg:rgba(245,158,11,.17);
  --accent:#E11D48; --on-accent:#FFFFFF; --track:#C2410C; --track-bg:rgba(249,115,22,.15); --gold:#B45309; --gold-bg:rgba(245,158,11,.16);
  --c-console:#6D28D9; --c-pc:#0E7490; --c-board:#B45309; --c-party:#BE123C;
  --shadow:0 1px 1px rgba(40,30,90,.04),0 12px 32px -14px rgba(40,30,90,.24);
  --shadow-pop:0 28px 70px -18px rgba(40,30,90,.42);
  --scrim:rgba(30,25,70,.32);
  color-scheme:light;
}

/* ---------- Base ---------- */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scrollbar-width:thin;scrollbar-color:var(--stroke-2) transparent}
html.lock{overflow:hidden}
body{margin:0;color:var(--fg);background:var(--bg-a);font:500 16px/1.5 "DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
::selection{background:color-mix(in srgb,var(--primary) 32%,transparent)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--stroke-2);border-radius:99px;border:3px solid transparent;background-clip:padding-box}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit;-webkit-tap-highlight-color:transparent}
h1,h2,h3,p{margin:0}
:focus{outline:none}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
[hidden]{display:none!important}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.wrap{max-width:1440px;margin:0 auto;padding:0 16px}
.display{font-family:"Space Grotesk","DM Sans",sans-serif;font-weight:700;letter-spacing:-.02em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-variant-numeric:tabular-nums}
.skip{position:fixed;left:16px;top:-60px;z-index:100;background:var(--fg);color:var(--bg-a);padding:10px 16px;border-radius:12px;font-weight:700;text-decoration:none;transition:top .2s}
.skip:focus{top:12px}

/* aurora backdrop */
.aurora{position:fixed;inset:0;z-index:-1;overflow:hidden;background:linear-gradient(155deg,var(--bg-a),var(--bg-b) 46%,var(--bg-c));pointer-events:none}
.aurora i{position:absolute;display:block;border-radius:50%;filter:blur(90px);will-change:transform}
.aurora .o1{width:54vmax;height:54vmax;left:-16vmax;top:-20vmax;background:var(--orb1);animation:d1 28s ease-in-out infinite alternate}
.aurora .o2{width:46vmax;height:46vmax;right:-14vmax;top:6vmax;background:var(--orb2);animation:d2 34s ease-in-out infinite alternate}
.aurora .o3{width:42vmax;height:42vmax;left:26vmax;bottom:-24vmax;background:var(--orb3);animation:d3 31s ease-in-out infinite alternate}
.aurora .grid{inset:0;border-radius:0;filter:none;background-image:linear-gradient(var(--gridc) 1px,transparent 1px),linear-gradient(90deg,var(--gridc) 1px,transparent 1px);background-size:46px 46px;-webkit-mask-image:radial-gradient(ellipse 90% 70% at 50% 0%,#000 10%,transparent 75%);mask-image:radial-gradient(ellipse 90% 70% at 50% 0%,#000 10%,transparent 75%)}
@keyframes d1{to{transform:translate(12vmax,10vmax) scale(1.15)}}
@keyframes d2{to{transform:translate(-14vmax,12vmax) scale(.9)}}
@keyframes d3{to{transform:translate(-10vmax,-12vmax) scale(1.2)}}
html.still .aurora i{animation:none}

/* glass surfaces */
.glass{background:var(--glass);border:1px solid var(--stroke);border-radius:var(--r);box-shadow:var(--shadow),var(--hi);-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%)}
.card{background:var(--glass);border:1px solid var(--stroke);border-radius:var(--r);box-shadow:var(--shadow),var(--hi)}

/* ---------- Header ---------- */
header.top{position:sticky;top:0;z-index:40;padding-top:12px}
.bar{display:flex;align-items:center;gap:12px;padding:9px 10px 9px 12px;border-radius:22px;position:relative}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;margin-right:auto;border-radius:14px;padding-right:6px}
.brand-mark{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:#fff;background:var(--grad);box-shadow:0 8px 22px -8px rgba(192,38,211,.7),inset 0 1px 0 rgba(255,255,255,.35)}
.brand-mark svg{width:22px;height:22px}
.brand b{display:block;font-size:18px;line-height:1.1}
.brand small{display:block;color:var(--muted);font-size:12.5px;font-weight:500}
nav.tabs{display:flex;gap:2px;background:var(--sunk);padding:4px;border-radius:15px;border:1px solid var(--stroke)}
nav.tabs a{display:flex;align-items:center;gap:8px;text-decoration:none;padding:8px 14px;border-radius:11px;font-weight:600;font-size:14.5px;color:var(--muted);min-height:40px;transition:background .2s,color .2s,box-shadow .2s}
nav.tabs a:hover{color:var(--fg)}
nav.tabs a[aria-current="page"]{background:var(--glass-2);color:var(--fg);box-shadow:var(--shadow),var(--hi)}
nav.tabs a[aria-current="page"] svg{color:var(--primary)}
.spot{position:relative;display:flex;align-items:center;width:270px}
.spot > svg{position:absolute;left:13px;color:var(--muted);pointer-events:none}
.spot input{width:100%;height:44px;border-radius:14px;border:1px solid var(--stroke);background:var(--sunk);padding:0 44px 0 40px;font-size:14.5px;font-weight:500;transition:border-color .2s,background .2s,box-shadow .2s}
.spot input::placeholder{color:var(--muted);opacity:1}
.spot input:focus{border-color:var(--primary);background:var(--glass-2);box-shadow:0 0 0 4px color-mix(in srgb,var(--primary) 18%,transparent)}
.spot kbd{position:absolute;right:10px;pointer-events:none}
kbd{font:600 11px "DM Sans",sans-serif;color:var(--muted);border:1px solid var(--stroke-2);border-radius:6px;padding:1px 6px;background:var(--glass)}
.spot .clr{position:absolute;right:6px;display:none}
.spot.on input{border-color:color-mix(in srgb,var(--track) 60%,transparent);background:var(--track-bg);color:var(--track);font-weight:700}
.spot.on .clr{display:grid}
.spot.on kbd,.spot:focus-within kbd{display:none}
.ib{width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:14px;border:1px solid var(--stroke);background:var(--glass);box-shadow:var(--hi);transition:background .2s,border-color .2s,transform .12s}
.ib:hover{background:var(--glass-2);border-color:var(--stroke-2)}
.ib:active{transform:scale(.94)}
.ib.sm{width:32px;height:32px;border-radius:10px}
.ib.sm svg{width:15px;height:15px}
#themeBtn svg{transition:transform .5s cubic-bezier(.3,1.5,.5,1)}
#themeBtn:hover svg{transform:rotate(40deg)}

/* popover (dropdown / spotlight / menu) */
.pop{position:fixed;z-index:80;background:var(--glass-pop);border:1px solid var(--stroke-2);border-radius:18px;box-shadow:var(--shadow-pop),var(--hi);-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);overflow:auto;overscroll-behavior:contain;padding:6px;opacity:0;transform:translateY(-6px) scale(.98);transform-origin:top center;transition:opacity .16s,transform .2s cubic-bezier(.2,1.2,.4,1)}
.pop.open{opacity:1;transform:none}
.pop-g{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:10px 10px 4px}
.opt{display:flex;align-items:center;gap:10px;padding:8px 10px;min-height:44px;border-radius:12px;cursor:pointer;font-size:14.5px}
.opt .opt-t{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.opt b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opt small{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opt.act{background:color-mix(in srgb,var(--primary) 16%,transparent)}
.opt.sel b{color:var(--primary)}
.opt .tick{color:var(--primary);stroke-width:3;width:16px;height:16px}
.opt.dis{opacity:.7;cursor:default}
.opt.danger b{color:var(--accent)}
.opt .oi{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;flex:none;color:var(--cc,var(--muted));background:color-mix(in srgb,var(--cc,var(--muted)) 14%,transparent)}
.pop-empty{padding:18px 14px;color:var(--muted);font-size:14px;text-align:center}
.menu{width:270px;transform-origin:top right}
.mi{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;min-height:44px;border:0;background:none;border-radius:12px;font-size:14.5px;font-weight:600;text-align:left}
.mi:hover,.mi:focus-visible{background:color-mix(in srgb,var(--primary) 14%,transparent)}
.mi.danger{color:var(--accent)}
.mi .sw-track{margin-left:auto}
.menu hr{border:0;border-top:1px solid var(--stroke);margin:6px 4px}

/* custom controls */
.dd{display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:0 12px 0 14px;border-radius:14px;border:1px solid var(--stroke);background:var(--glass);box-shadow:var(--hi);font-size:14.5px;font-weight:600;max-width:100%;transition:border-color .2s,background .2s,box-shadow .2s}
.dd:hover{border-color:var(--stroke-2);background:var(--glass-2)}
.dd[aria-expanded="true"]{border-color:var(--primary);box-shadow:0 0 0 4px color-mix(in srgb,var(--primary) 18%,transparent)}
.dd .dd-v{display:flex;align-items:center;gap:8px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;text-align:left}
.dd .dd-l{color:var(--muted);font-weight:500}
.dd .chev{color:var(--muted);transition:transform .2s}
.dd[aria-expanded="true"] .chev{transform:rotate(180deg)}
.dd.block{display:flex;width:100%;border-style:dashed;border-color:var(--stroke-2);background:var(--sunk)}
.dd.block .dd-v{color:var(--muted);font-weight:600}
.chk,.sw{display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:0 4px;border:0;background:none;font-size:14.5px;font-weight:600;border-radius:12px}
.chk:disabled,.sw:disabled{opacity:.5;cursor:not-allowed}
.box{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--stroke-2);background:var(--sunk);display:grid;place-items:center;color:var(--on-primary);transition:background .2s,border-color .2s,transform .15s}
.box svg{width:14px;height:14px;stroke-width:3.2;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .25s ease-out .05s}
[aria-checked="true"] > .box{background:var(--grad);border-color:transparent}
[aria-checked="true"] > .box svg{stroke-dashoffset:0}
.chk:active .box{transform:scale(.88)}
.sw-track{width:42px;height:24px;border-radius:99px;background:var(--sunk);border:1.5px solid var(--stroke-2);position:relative;flex:none;transition:background .25s,border-color .25s}
.sw-thumb{position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:var(--muted);transition:transform .28s cubic-bezier(.3,1.5,.5,1),background .2s}
[aria-checked="true"] .sw-track{background:var(--grad);border-color:transparent}
[aria-checked="true"] .sw-thumb{transform:translateX(18px);background:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;border:1px solid var(--stroke);background:var(--glass);box-shadow:var(--hi);padding:0 16px;font-weight:600;font-size:14.5px;min-height:44px;text-decoration:none;transition:background .2s,border-color .2s,transform .12s,box-shadow .2s}
.btn:hover{background:var(--glass-2);border-color:var(--stroke-2)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--grad);border-color:transparent;color:var(--on-primary);box-shadow:0 10px 26px -10px rgba(192,38,211,.7),inset 0 1px 0 rgba(255,255,255,.3)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{background:var(--accent);border-color:transparent;color:var(--on-accent)}
.btn.trk{background:var(--track-bg);border-color:color-mix(in srgb,var(--track) 55%,transparent);color:var(--track)}
.chip{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;text-decoration:none;padding:0 14px;min-height:40px;border-radius:99px;border:1px solid var(--stroke);background:var(--glass);box-shadow:var(--hi);font-size:14px;font-weight:600;color:var(--muted);transition:color .2s,border-color .2s,background .2s,transform .12s}
.chip:hover{color:var(--fg);border-color:var(--stroke-2)}
.chip:active{transform:scale(.96)}
.chip[aria-current="page"],.chip.on,.chip[aria-pressed="true"]{color:var(--fg);border-color:color-mix(in srgb,var(--cc,var(--primary)) 70%,transparent);background:color-mix(in srgb,var(--cc,var(--primary)) 18%,var(--glass));box-shadow:0 6px 18px -10px var(--cc,var(--primary)),var(--hi)}
.chip svg{color:var(--cc,currentColor)}
.field{position:relative;flex:1 1 260px;min-width:200px;max-width:400px}
.field > svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.field input{width:100%;height:46px;border-radius:14px;border:1px solid var(--stroke);background:var(--glass);box-shadow:var(--hi);padding:0 42px 0 42px;font-size:15px;transition:border-color .2s,box-shadow .2s,background .2s}
.field input::placeholder{color:var(--muted);opacity:1}
.field input:focus{border-color:var(--primary);background:var(--glass-2);box-shadow:0 0 0 4px color-mix(in srgb,var(--primary) 18%,transparent)}
.field .clr{position:absolute;right:7px;top:7px}
.field input:placeholder-shown ~ .clr{display:none}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:var(--sunk);color:var(--muted);white-space:nowrap;border:1px solid var(--stroke)}
.pill.done{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.pill.live{background:var(--accent);color:var(--on-accent);border-color:transparent;animation:pulse 1.6s infinite}
.pill.today{background:color-mix(in srgb,var(--primary) 16%,transparent);color:var(--primary);border-color:transparent}
.pill.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.pill.gold{background:var(--gold-bg);color:var(--gold);border-color:transparent}
.pill svg.i{width:12px;height:12px;stroke-width:3}
@keyframes pulse{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 0%,transparent)}0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 50%,transparent)}}
.av{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:none;font:700 10.5px "Space Grotesk",sans-serif;letter-spacing:.02em;color:#fff;background:linear-gradient(135deg,hsl(var(--h) 62% 46%),hsl(calc(var(--h) + 45) 62% 34%));box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.av.lg{width:52px;height:52px;border-radius:16px;font-size:17px}
.av.ghost{background:none;border:1.5px dashed var(--stroke-2);color:var(--muted);box-shadow:none}
.avs{display:flex;flex:none}
.avs .av + .av{margin-left:-9px;outline:2px solid var(--bg-b)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:13.5px}
.meta span{display:inline-flex;align-items:center;gap:6px}
.meta svg.i{width:15px;height:15px}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block;background:var(--cc);box-shadow:0 0 10px var(--cc)}

/* main also carries .wrap, whose padding would otherwise win and glue the page to the header and the phone dock */
main.wrap{padding:22px 16px 110px}
main.enter > *{animation:rise .42s cubic-bezier(.2,.8,.3,1) both}
main.enter > *:nth-child(2){animation-delay:.05s}
main.enter > *:nth-child(3){animation-delay:.1s}
main.enter > *:nth-child(n+4){animation-delay:.14s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}

/* ---------- Overview ---------- */
.hero{display:grid;grid-template-columns:1.35fr 1fr;gap:16px}
.hero-main{padding:34px 34px 30px;position:relative;overflow:hidden}
.hero-main::after{content:"";position:absolute;right:-90px;top:-90px;width:300px;height:300px;border-radius:50%;background:var(--grad);opacity:.22;filter:blur(50px);pointer-events:none}
.hero-main h1{font-size:clamp(34px,4.6vw,60px);line-height:1.02;margin:14px 0 14px}
.gt{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-main p{color:var(--muted);max-width:56ch;font-size:16.5px}
.hero-cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.cdp{padding:24px;display:flex;flex-direction:column;gap:14px}
.cdp .big{font-size:26px;line-height:1.15}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cd div{background:var(--sunk);border:1px solid var(--stroke);border-radius:16px;padding:12px 4px 9px;text-align:center}
.cd b{display:block;font:700 30px/1 "Space Grotesk",sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.cd span{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.upl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.upl a{display:grid;grid-template-columns:76px 12px 1fr;gap:10px;align-items:center;text-decoration:none;font-size:14px;padding:7px 8px;border-radius:10px;min-height:38px;transition:background .15s}
.upl a:hover{background:var(--glass-2)}
.upl time{color:var(--muted);font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}
.stat{padding:16px 18px;display:flex;align-items:center;gap:14px}
.stat .si{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--primary);background:color-mix(in srgb,var(--primary) 14%,transparent);flex:none}
.stat b{display:block;font:700 26px/1.05 "Space Grotesk",sans-serif;font-variant-numeric:tabular-nums}
.stat b small{font-size:14px;color:var(--muted);font-weight:600}
.stat span{color:var(--muted);font-size:13px}
.sec-h{display:flex;align-items:center;gap:12px;margin:34px 0 14px;font-size:21px}
.sec-h .ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--cc,var(--gold));background:color-mix(in srgb,var(--cc,var(--gold)) 14%,transparent);border:1px solid color-mix(in srgb,var(--cc,var(--gold)) 30%,transparent)}
.sec-h small{font-family:"DM Sans",sans-serif;color:var(--muted);font-size:14px;font-weight:500;letter-spacing:0}
.wall{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.wtile{padding:12px 14px;border-radius:16px;text-decoration:none;display:flex;flex-direction:column;gap:2px;min-height:74px;position:relative;overflow:hidden;transition:transform .2s,border-color .2s}
.wtile:hover{transform:translateY(-2px);border-color:var(--stroke-2)}
.wtile span{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--cc);display:flex;align-items:center;gap:6px}
.wtile b{font-size:14.5px;line-height:1.25}
.wtile.tbd b{color:var(--muted);font-weight:500}
.wtile.won{border-color:color-mix(in srgb,var(--gold) 50%,transparent);background:linear-gradient(160deg,var(--gold-bg),var(--glass))}
.wtile.won svg{position:absolute;right:10px;top:10px;color:var(--gold)}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.gcard{display:flex;flex-direction:column;gap:12px;text-decoration:none;padding:20px;position:relative;overflow:hidden;transition:transform .25s cubic-bezier(.2,.8,.3,1),border-color .25s,box-shadow .25s}
.gcard::before{content:"";position:absolute;left:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:var(--cc);opacity:.16;filter:blur(34px);transition:opacity .3s,transform .4s}
.gcard:hover{transform:translateY(-4px);border-color:color-mix(in srgb,var(--cc) 55%,transparent);box-shadow:0 22px 44px -22px var(--cc),var(--hi)}
.gcard:hover::before{opacity:.32;transform:scale(1.25)}
.gtop{display:flex;align-items:center;gap:12px;position:relative}
.gico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none;color:var(--cc);background:color-mix(in srgb,var(--cc) 15%,transparent);border:1px solid color-mix(in srgb,var(--cc) 32%,transparent)}
.gcard h3{font-size:19px;line-height:1.2;flex:1}
.gcard .go{color:var(--muted);transition:transform .25s,color .25s}
.gcard:hover .go{transform:translateX(4px);color:var(--cc)}
.gcard .fmt{color:var(--muted);font-size:14px;line-height:1.45;flex:1;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.prog{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.pbar{flex:1;height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--cc);border-radius:99px;box-shadow:0 0 12px var(--cc);transition:width .5s cubic-bezier(.2,.8,.3,1)}
.champ{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--gold);font-size:14px}

/* ---------- Game page ---------- */
.gnav{display:flex;gap:18px;overflow-x:auto;padding:8px 10px;margin-bottom:14px;scrollbar-width:none;border-radius:99px}
.gnav::-webkit-scrollbar{display:none}
.gnav-grp{display:flex;align-items:center;gap:6px;flex:none}
.gnav-grp > span{display:inline-flex;color:var(--cc);margin:0 2px 0 4px}
.gnav .chip{min-height:38px;background:transparent;box-shadow:none;border-color:transparent}
.gnav .chip:hover{background:var(--glass-2)}
.gnav .chip[aria-current="page"]{background:color-mix(in srgb,var(--cc) 20%,var(--glass-2));border-color:color-mix(in srgb,var(--cc) 60%,transparent)}
.ghead{padding:24px 26px;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;margin-bottom:16px;position:relative;overflow:hidden}
.ghead::before{content:"";position:absolute;left:-70px;top:-70px;width:240px;height:240px;border-radius:50%;background:var(--cc);opacity:.2;filter:blur(50px);pointer-events:none}
.ghead > *{position:relative}
.ghead h1{margin:10px 0 8px;font-size:clamp(28px,3.6vw,44px);line-height:1.05}
.ghead .fmt{margin-bottom:14px;color:var(--muted);max-width:78ch}
/* Event headers with banner art (FFA, 2v2, Challenger): the whole banner fills the card at its own 3:1 shape, and a
   frosted, tinted strip along the bottom carries the text. The art is dark in both themes, so the text stays light.
   Each event sets its picture (--art), its accent (--ac) and the dark tone the art fades into (--abg). */
.art-ffa{--art:url(/ffa-banner.webp);--ac:#B79CFF;--abg:#130F1E}
.art-t2{--art:url(/2v2-banner.webp);--ac:#4FD8F0;--abg:#0C1320}
.art-ch{--art:url(/challenger-banner.webp);--ac:#FBC548;--abg:#120B2E}
.ghead.art{--cc:var(--ac) !important;--fg:#F4F2FF;--muted:#D6D3EA;--sunk:rgba(255,255,255,.16);color:var(--fg);border-color:color-mix(in srgb,var(--ac) 28%,rgba(255,255,255,.14));background:var(--abg);
  aspect-ratio:2172/724;align-items:end;padding:26px 28px}
.ghead.art::before{inset:0;width:auto;height:auto;border-radius:0;opacity:1;filter:none;background:var(--art) center/cover no-repeat}
.ghead.art::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(0deg,color-mix(in srgb,var(--abg) 84%,transparent) 0%,color-mix(in srgb,var(--abg) 52%,transparent) 30%,transparent 58%),linear-gradient(90deg,color-mix(in srgb,var(--abg) 38%,transparent),transparent 55%);
  -webkit-backdrop-filter:blur(12px) saturate(140%);backdrop-filter:blur(12px) saturate(140%);
  -webkit-mask-image:linear-gradient(0deg,#000 0%,#000 34%,transparent 62%);mask-image:linear-gradient(0deg,#000 0%,#000 34%,transparent 62%)}
.ghead.art > *{z-index:1}
.ghead.art h1{text-shadow:0 2px 18px color-mix(in srgb,var(--abg) 75%,transparent)}
.ghead.art .fmt,.ghead.art .meta{text-shadow:0 1px 8px color-mix(in srgb,var(--abg) 85%,transparent)}
.ghead.art .fmt{margin-bottom:10px}
.ghead.art .badge{background:color-mix(in srgb,var(--ac) 16%,transparent);border-color:color-mix(in srgb,var(--ac) 45%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.ghead.art .ring{border-radius:50%;background:color-mix(in srgb,var(--abg) 50%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
/* Narrow screens: too narrow to write over a 3:1 picture, so the whole banner sits on top and the text follows on frosted glass. */
@media (max-width:1100px){
  .ghead.art{aspect-ratio:auto;padding:calc((100vw - 32px) / 3 + 6px) 20px 20px}
  .ghead.art::before{background:linear-gradient(180deg,transparent calc((100vw - 32px) / 3 - 34px),var(--abg) calc((100vw - 32px) / 3 + 4px)),var(--art) top/100% auto no-repeat}
  .ghead.art::after{background:radial-gradient(120% 60% at 50% 100%,color-mix(in srgb,var(--ac) 16%,transparent),transparent 70%);-webkit-backdrop-filter:none;backdrop-filter:none;-webkit-mask-image:none;mask-image:none}
}
/* Challenger line-up cards: plain glass like the other cards, with amber accents. */
.chgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.chcard{--cc:var(--c-board);position:relative;padding:44px 18px 20px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;
  border-color:color-mix(in srgb,var(--cc) 30%,var(--stroke));transition:transform .22s,border-color .22s,box-shadow .22s}
.chcard:hover{transform:translateY(-4px);border-color:color-mix(in srgb,var(--cc) 60%,transparent);box-shadow:var(--shadow),0 18px 44px -22px var(--cc),var(--hi)}
.chc-no{position:absolute;top:12px;left:14px;font-size:13px;letter-spacing:.08em;color:var(--cc);padding:3px 9px;border-radius:99px;background:color-mix(in srgb,var(--cc) 12%,transparent);border:1px solid color-mix(in srgb,var(--cc) 35%,transparent)}
.chcard .av.lg{width:68px;height:68px;border-radius:20px;font-size:22px;box-shadow:0 0 0 3px color-mix(in srgb,var(--cc) 55%,transparent),0 10px 28px -10px var(--cc)}
.chcard h3{font-size:18px;line-height:1.2;margin-top:4px}
.chc-tag{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--cc);padding:5px 12px;border-radius:99px;background:color-mix(in srgb,var(--cc) 12%,transparent);border:1px solid color-mix(in srgb,var(--cc) 35%,transparent)}
.chc-tag svg.i{width:14px;height:14px}
.chc-tags{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.chc-ev{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ec);padding:5px 11px;border-radius:99px;background:color-mix(in srgb,var(--ec) 12%,transparent);border:1px solid color-mix(in srgb,var(--ec) 35%,transparent)}
.chc-ev svg.i{width:14px;height:14px}
.fees{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.fee{display:inline-flex;align-items:baseline;gap:7px;padding:7px 13px;border-radius:12px;font:700 15px/1.1 "Space Grotesk",sans-serif;color:#fff;background:color-mix(in srgb,var(--ec) 16%,rgba(14,8,38,.5));border:1px solid color-mix(in srgb,var(--ec) 45%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.fee svg.i{width:15px;height:15px;align-self:center;color:var(--ec)}
.fee b{color:var(--ec);letter-spacing:.06em;font-size:12.5px;text-transform:uppercase}
.fee small{font:500 12px/1 inherit;font-family:inherit;color:#D6D3EA}
.chc-days{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.chc-days svg.i{width:14px;height:14px}
@media (max-width:520px){ .chgrid{grid-template-columns:1fr 1fr;gap:10px} .chcard{padding:42px 10px 16px;gap:8px} .chcard .av.lg{width:56px;height:56px;font-size:18px} .chcard h3{font-size:15px} .chc-tag,.chc-ev{font-size:10px;letter-spacing:.06em;padding:4px 8px} }
.badge{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--cc);padding:5px 11px;border-radius:99px;background:color-mix(in srgb,var(--cc) 14%,transparent);border:1px solid color-mix(in srgb,var(--cc) 30%,transparent)}
.ring{width:104px;height:104px;position:relative;display:grid;place-items:center;text-align:center}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg);filter:drop-shadow(0 0 8px color-mix(in srgb,var(--cc) 60%,transparent))}
.ring b{font:700 22px/1 "Space Grotesk",sans-serif;font-variant-numeric:tabular-nums}
.ring small{display:block;font-size:11px;color:var(--muted);margin-top:3px}
.subtabs{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;gap:2px;padding:4px;border-radius:15px;background:var(--sunk);border:1px solid var(--stroke)}
.seg a,.seg button{display:inline-flex;align-items:center;gap:7px;text-decoration:none;border:0;background:none;padding:0 14px;min-height:38px;border-radius:11px;font-size:14px;font-weight:600;color:var(--muted);transition:background .2s,color .2s}
.seg a:hover,.seg button:hover{color:var(--fg)}
.seg .on{background:var(--glass-2);color:var(--fg);box-shadow:var(--shadow),var(--hi)}
.seg .on svg{color:var(--cc,var(--primary))}
.subtabs .hint{margin-left:auto;color:var(--muted);font-size:13.5px;display:flex;align-items:center;gap:7px}

.bracket{overflow-x:auto;padding:6px 4px 18px;scrollbar-width:thin;cursor:grab;--fl:0px;--fr:0px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 var(--fl),#000 calc(100% - var(--fr)),transparent);mask-image:linear-gradient(90deg,transparent,#000 var(--fl),#000 calc(100% - var(--fr)),transparent)}
.bracket.fl{--fl:36px}.bracket.fr{--fr:36px}
.bracket.drag{cursor:grabbing;user-select:none}
.bracket.drag *{pointer-events:none}
.binner{position:relative;display:flex;gap:72px;width:max-content;min-width:100%;align-items:stretch;padding:4px 6px 8px}
svg.links{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
svg.links path{fill:none;stroke:var(--stroke-2);stroke-width:2;transition:stroke .35s}
svg.links path.on{stroke:var(--cc);stroke-width:2.5;filter:drop-shadow(0 0 5px var(--cc))}
svg.links path.flow{stroke:#fff;stroke-width:2.5;stroke-dasharray:3 26;stroke-linecap:round;opacity:.75;animation:flow 1.6s linear infinite;filter:none}
:root[data-theme="light"] svg.links path.flow{opacity:.95}
@keyframes flow{to{stroke-dashoffset:-29}}
html.still svg.links path.flow{display:none}
.col{display:flex;flex-direction:column;width:280px;flex:none}
.col.w2{width:310px}
.col.wide{width:430px}
.col-h{margin-bottom:14px;padding:0 4px;display:flex;align-items:center;gap:10px}
.col-h .n{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font:700 13px "Space Grotesk",sans-serif;color:var(--cc);background:color-mix(in srgb,var(--cc) 15%,transparent);border:1px solid color-mix(in srgb,var(--cc) 30%,transparent);flex:none}
.col-h b{display:block;font:700 15px/1.2 "Space Grotesk",sans-serif;letter-spacing:.06em;text-transform:uppercase}
.col-h span{font-size:13px;color:var(--muted)}
.col-b{flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:18px}

.match{border-radius:18px;overflow:hidden;position:relative;transition:border-color .25s,box-shadow .25s}
.match.done{border-color:color-mix(in srgb,var(--cc) 42%,transparent)}
.match.flash{animation:flash 1.8s ease-out}
@keyframes flash{0%,35%{box-shadow:0 0 0 3px var(--cc),0 0 40px -4px var(--cc)}}
.mh{display:flex;align-items:center;gap:8px;padding:9px 12px 8px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--stroke);background:var(--sunk);white-space:nowrap}
.mh .mid{font-weight:700;color:var(--fg);font-variant-numeric:tabular-nums}
.mh .stn{overflow:hidden;text-overflow:ellipsis;min-width:0}
.mh .when{margin-left:auto;font-variant-numeric:tabular-nums}
.mt{padding:9px 12px 3px;font-size:13.5px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
.mt > span:not(.pill){color:var(--muted);font-weight:500;font-size:12px;white-space:nowrap}
.picks{padding:4px 6px 8px;display:flex;flex-direction:column;gap:3px}
.pick{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:6px 8px;min-height:44px;border-radius:12px;border:1px solid transparent;background:transparent;font-size:14px;font-weight:600;line-height:1.25;transition:background .18s,border-color .18s,opacity .2s,transform .12s}
button.pick:hover{background:var(--glass-2);border-color:var(--stroke)}
button.pick:active{transform:scale(.98)}
.pick .nm{flex:1;min-width:0}
.pick .nm small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.ind{flex:none;width:24px;height:24px;display:grid;place-items:center;border:1.5px solid var(--stroke-2);color:var(--on-ok);font:700 11px "Space Grotesk",sans-serif;transition:background .2s,border-color .2s,transform .25s cubic-bezier(.3,1.7,.5,1)}
.ind.rd{border-radius:50%}
.ind.sq{border-radius:8px}
.ind svg{width:14px;height:14px;stroke-width:3.2;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .25s ease-out .05s}
.pick.win{background:var(--ok-bg);border-color:color-mix(in srgb,var(--ok) 38%,transparent)}
.pick.win .ind{background:var(--ok);border-color:var(--ok);transform:scale(1.06)}
.pick.win .ind svg{stroke-dashoffset:0}
.pick.lose{opacity:.5}
.pick.lose .nm{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 60%,transparent)}
.pick.draw{background:var(--warn-bg)}
.pick.draw .ind{background:var(--warn);border-color:var(--warn);color:#2B1A00}
.pick.ph{color:var(--muted);font-weight:500;font-style:italic;cursor:default}
.pick.tracked{box-shadow:inset 3px 0 0 var(--track)}
.pick.tracked .nm{color:var(--track)}
.pick.win.tracked .nm{color:inherit}
.final .pick.win{background:var(--gold-bg);border-color:color-mix(in srgb,var(--gold) 45%,transparent)}
.final .pick.win .ind{background:var(--gold);border-color:var(--gold);color:#2B1A00}
.final .pick.win .ind svg{stroke-dasharray:none;stroke-dashoffset:0;stroke-width:2.4}
.ru-row{display:flex;align-items:center;gap:4px}
.ru-row .pick{flex:1;min-width:0}
.vs{display:flex;align-items:center;gap:8px;font:700 10.5px "Space Grotesk",sans-serif;color:var(--muted);padding:0 10px;letter-spacing:.16em}
.vs::before,.vs::after{content:"";flex:1;height:1px;background:var(--stroke)}
.mf{padding:0 12px 10px;font-size:12px;color:var(--muted)}
.bye{border-style:dashed;background:transparent;box-shadow:none;padding:12px 14px;font-size:13px;color:var(--muted)}
.bye b{display:flex;align-items:center;gap:8px;color:var(--fg);font-size:14px;margin-top:6px}
.final{border-color:color-mix(in srgb,var(--gold) 50%,transparent);background:linear-gradient(170deg,var(--gold-bg),var(--glass) 55%);box-shadow:0 20px 50px -24px var(--gold),var(--hi)}
.final .mh{background:transparent;color:var(--gold);border-bottom-color:color-mix(in srgb,var(--gold) 25%,transparent)}
.final .mh .mid{color:var(--gold);letter-spacing:.08em}
.crown{display:flex;align-items:center;gap:12px;margin:2px 8px 10px;padding:11px 13px;border-radius:14px;background:var(--gold-bg);border:1px solid color-mix(in srgb,var(--gold) 35%,transparent);color:var(--gold);animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
.crown svg{width:22px;height:22px}
.crown small{display:block;font-weight:700;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase}
.crown b{display:block;font-size:16px;color:var(--fg);line-height:1.2}
@keyframes pop{from{transform:scale(.85);opacity:0}}

.league table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.league th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:center;padding:9px 6px}
.league th:nth-child(2){text-align:left}
.league td{padding:7px 6px;text-align:center;border-top:1px solid var(--stroke)}
.league td:first-child{width:38px;color:var(--muted);font-weight:700}
.league td:nth-child(2){text-align:left;font-weight:600}
.league td:nth-child(2) span{display:flex;align-items:center;gap:9px}
.league td:last-child{font-weight:700;font-family:"Space Grotesk",sans-serif;font-size:15px}
.league tr.adv{background:color-mix(in srgb,var(--cc) 9%,transparent)}
.league tr.adv td:first-child{color:var(--cc)}
.league tr.cut td{border-top:2px dashed color-mix(in srgb,var(--cc) 60%,transparent)}
.league tr.tracked td:nth-child(2){color:var(--track)}
.lnote{margin:9px 12px 6px;font-size:12.5px;color:var(--muted);display:flex;gap:7px;align-items:flex-start}
.lnote svg{width:15px;height:15px;margin-top:1px}
.lnote.warn{color:var(--warn)}
.fx-t{display:flex;align-items:center;gap:8px;width:100%;border:0;border-top:1px solid var(--stroke);background:none;padding:0 14px;min-height:48px;font-size:13.5px;font-weight:700;text-align:left;transition:background .2s}
.fx-t:hover{background:var(--glass-2)}
.fx-t .chev{margin-left:auto;transition:transform .25s}
.fx-t[aria-expanded="true"] .chev{transform:rotate(180deg)}
.fx-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .32s cubic-bezier(.2,.8,.3,1)}
.fx-b.open{grid-template-rows:1fr}
.fx-b > div{overflow:hidden;min-height:0}
.fxl{padding:2px 8px 10px;display:flex;flex-direction:column;gap:6px}
.fxr{border:1px solid var(--stroke);border-radius:14px;padding:5px 6px 6px;background:var(--sunk)}
.fxr.flash{animation:flash 1.8s ease-out}
.fxh{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);padding:0 4px 2px 6px;font-variant-numeric:tabular-nums;min-height:30px}
.fxh b{color:var(--fg)}
.fxh .chk{margin-left:auto;min-height:30px;font-size:12px;gap:6px}
.fxh .box{width:18px;height:18px;border-radius:6px}
.fxh .box svg{width:11px;height:11px}
.fxr .row2{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.fxr .pick{min-height:40px;padding:4px 7px;font-size:13px;gap:7px;background:var(--glass)}
.fxr .pick.win{background:var(--ok-bg)}
.fxr .pick.draw{background:var(--warn-bg)}
.fxr .ind{width:20px;height:20px}
.fxr .ind svg{width:12px;height:12px}
.note{display:flex;gap:12px;align-items:flex-start;margin-top:12px;padding:13px 16px;border-radius:16px;color:var(--muted);font-size:14px}
.note svg{margin-top:2px;color:var(--primary)}
.note.zap{border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.note.zap svg{color:var(--warn)}
.note b{color:var(--fg)}

/* ---------- Schedule / players ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center;padding:12px;margin-bottom:10px;position:relative;z-index:2}
.toolbar .grow{flex:1}
.days{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:none;margin-bottom:6px}
.days::-webkit-scrollbar{display:none}
.dayb{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:62px;min-height:60px;padding:6px 10px;border-radius:16px;border:1px solid var(--stroke);background:var(--glass);box-shadow:var(--hi);transition:all .2s}
.dayb small{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.dayb b{font:700 19px/1.1 "Space Grotesk",sans-serif;font-variant-numeric:tabular-nums}
.dayb:hover{border-color:var(--stroke-2);transform:translateY(-1px)}
.dayb[aria-pressed="true"]{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 12px 26px -12px rgba(192,38,211,.8),inset 0 1px 0 rgba(255,255,255,.3)}
.dayb[aria-pressed="true"] small{color:rgba(255,255,255,.85)}
.dayb.today::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent);margin-top:2px}
.day{margin-bottom:22px}
.day-h{display:inline-flex;align-items:center;gap:10px;margin:0 0 10px;font-size:16px;position:sticky;top:86px;z-index:5;padding:7px 14px;border-radius:99px}
/* It sticks over the cards while scrolling, so it needs a near-solid fill or the card text shows through it. */
.day-h.glass{background:color-mix(in srgb,var(--bg-b) 90%,transparent)}
.day-h small{font-family:"DM Sans",sans-serif;color:var(--muted);font-size:13px;font-weight:500;letter-spacing:0}
.rows{display:flex;flex-direction:column;overflow:hidden}
.row{display:grid;grid-template-columns:104px 210px 1fr 130px 120px;gap:14px;align-items:center;padding:12px 18px 12px 20px;border-top:1px solid var(--stroke);text-decoration:none;font-size:14px;transition:background .18s;position:relative}
.row:first-child{border-top:0}
a.row:hover{background:var(--glass-2)}
.row::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 4px 4px 0;background:var(--cc);box-shadow:0 0 10px var(--cc)}
.row time{font:700 15px/1.2 "Space Grotesk",sans-serif;font-variant-numeric:tabular-nums}
.row time small{display:block;font:500 12px "DM Sans",sans-serif;color:var(--muted)}
.row .g{display:flex;align-items:center;gap:10px;min-width:0}
.row .g .gico{width:34px;height:34px;border-radius:11px}
.row .g div{min-width:0}
.row .g b{display:block;font-size:14px;line-height:1.25}
.row .g span{font-size:12px;color:var(--muted)}
.row .p{line-height:1.4}
.row .p small{display:block;color:var(--ok);font-weight:700;margin-top:2px}
.row .s{color:var(--muted);font-size:13px}
.row.done .p{color:var(--muted)}
mark{background:var(--track-bg);color:var(--track);border-radius:5px;padding:0 3px;margin:0 -3px;font-weight:700}
.empty{padding:48px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty svg{width:34px;height:34px;opacity:.7}
.empty b{color:var(--fg);font-size:17px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.pcard{padding:18px;display:flex;flex-direction:column;gap:12px;transition:transform .22s,border-color .22s}
.pcard:hover{transform:translateY(-3px);border-color:var(--stroke-2)}
.pcard.tracked{border-color:var(--track);box-shadow:0 0 0 1px var(--track),0 18px 40px -22px var(--track),var(--hi)}
.ptop{display:flex;gap:13px;align-items:center}
.ptop h3{font-size:16.5px;line-height:1.25}
.ptop p{margin-top:2px;font-size:13px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;border:1px solid color-mix(in srgb,var(--cc) 36%,transparent);background:color-mix(in srgb,var(--cc) 11%,transparent)}
.pact{display:flex;gap:8px;margin-top:auto}
.pact .btn{flex:1;min-height:42px;padding:0 10px}
.count{color:var(--muted);font-size:14px}

/* ---------- Modal ---------- */
.modal{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:16px}
.scrim{position:absolute;inset:0;background:var(--scrim);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:0;transition:opacity .22s}
.dialog{position:relative;width:min(520px,100%);max-height:min(86vh,720px);display:flex;flex-direction:column;background:var(--glass-pop);border-color:var(--stroke-2);box-shadow:var(--shadow-pop),var(--hi);border-radius:26px;padding:24px;opacity:0;transform:translateY(16px) scale(.97);transition:opacity .2s,transform .28s cubic-bezier(.2,1.2,.4,1)}
.modal.open .scrim{opacity:1}
.modal.open .dialog{opacity:1;transform:none}
.dialog .mx{position:absolute;right:14px;top:14px}
.dh{display:flex;gap:14px;align-items:center;padding-right:36px}
.dh h2{font-size:21px;line-height:1.2}
.dh p{color:var(--muted);font-size:14px;margin-top:3px}
.dicon{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;flex:none;color:var(--primary);background:color-mix(in srgb,var(--primary) 15%,transparent)}
.dicon.danger{color:var(--accent);background:color-mix(in srgb,var(--accent) 15%,transparent)}
.dicon svg{width:22px;height:22px}
.db{margin-top:16px;overflow:auto;color:var(--muted);font-size:14.5px;margin-right:-8px;padding-right:8px}
.df{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.tl-d{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.tl-d:first-child{margin-top:0}
.tl a{display:grid;grid-template-columns:108px 1fr auto;gap:10px;align-items:center;text-decoration:none;padding:8px 10px;border-radius:12px;min-height:46px;color:var(--fg);font-size:14px;transition:background .15s}
.tl a:hover{background:color-mix(in srgb,var(--primary) 12%,transparent)}
.tl time{color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
.tl span b{display:block;font-weight:600;line-height:1.25}
.tl span small{color:var(--muted);font-size:12.5px}

/* ---------- Dock, toast, confetti ---------- */
.dock{display:none;position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:45;padding:6px;border-radius:24px;gap:2px}
.dock a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;min-width:82px;min-height:54px;border-radius:18px;font-size:11.5px;font-weight:700;color:var(--muted);transition:background .2s,color .2s}
.dock a[aria-current="page"]{background:var(--glass-2);color:var(--fg);box-shadow:var(--hi)}
.dock a[aria-current="page"] svg{color:var(--primary)}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,24px) scale(.96);opacity:0;pointer-events:none;display:flex;align-items:center;gap:10px;background:var(--glass-pop);border:1px solid var(--stroke-2);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);color:var(--fg);padding:12px 18px;border-radius:16px;font-weight:600;font-size:14.5px;box-shadow:var(--shadow-pop),var(--hi);transition:opacity .22s,transform .3s cubic-bezier(.2,1.3,.4,1);z-index:95;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast svg{color:var(--ok);flex:none}
.toast.warn svg{color:var(--warn)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:96;overflow:hidden}
#confetti i{position:absolute;top:58%;border-radius:2px;animation:burst 2.3s cubic-bezier(.15,.7,.3,1) both}
@keyframes burst{0%{transform:translate(0,0) rotate(0);opacity:1}30%{transform:translate(calc(var(--dx)*.72),var(--dy)) rotate(calc(var(--r)*.4));opacity:1}100%{transform:translate(var(--dx),55vh) rotate(var(--r));opacity:0}}
footer{color:var(--muted);font-size:13px;text-align:center;padding:0 16px 120px}
footer b{color:var(--fg)}

/* ---------- Responsive ---------- */
@media (max-width:1180px){
  .row{grid-template-columns:96px 200px 1fr 120px}
  .row .s{display:none}
  .wall{grid-template-columns:repeat(4,1fr)}
  .brand small{display:none}
}
@media (max-width:980px){
  .hero{grid-template-columns:1fr}
  .spot{width:210px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .wall{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:760px){
  header.top{padding-top:8px;position:static}
  .bar{flex-wrap:wrap;gap:8px;border-radius:20px}
  .brand{flex:1 1 0;min-width:0;margin-right:0}
  .brand > span:last-child{min-width:0}
  .brand b,.brand small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  nav.tabs{display:none}
  .dock{display:flex}
  .spot{order:5;width:100%}
  .spot kbd{display:none}
  .brand small{display:block}
  main.wrap{padding-top:16px}
  .hero-main{padding:24px 20px}
  .cdp{padding:20px}
  .wall{grid-template-columns:repeat(2,1fr)}
  .ghead{grid-template-columns:1fr;padding:20px}
  .ring{display:none}
  .subtabs .hint{display:none}
  .bracket{cursor:auto;-webkit-mask-image:none;mask-image:none;overflow:visible;padding:0}
  .binner{flex-direction:column;width:auto;min-width:0;gap:22px;padding:0}
  .col,.col.wide,.col.w2{width:100%}
  .col + .col::before{content:"";display:block;width:2px;height:20px;margin:-4px 0 12px 17px;background:linear-gradient(var(--stroke-2),var(--cc));border-radius:2px}
  svg.links{display:none}
  .toolbar .field{max-width:none;flex-basis:100%}
  .toolbar .seg button span{display:none}
  .toolbar .seg button{padding:0 13px;min-width:44px;justify-content:center}
  .toolbar .grow{display:none}
  .row{grid-template-columns:74px 1fr;gap:6px 12px;padding:12px 14px 12px 18px}
  .row time{grid-row:span 3;align-self:start}
  .row .g,.row .p,.row .st{grid-column:2}
  .day-h{top:10px}
  .toast{bottom:92px}
  .dialog{padding:20px;border-radius:24px}
  .tl a{grid-template-columns:92px 1fr}
  .tl a .pill{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  .aurora i{animation:none}
  svg.links path.flow{display:none}
}

/* ---------- COD scoring ---------- */
.dock a{min-width:64px}
/* Six tabs (with the Challenger group) must still fit a 375px phone. */
.dock:has(a:nth-child(6)){width:min(calc(100vw - 16px), 520px)}
.dock:has(a:nth-child(6)) a{min-width:0;flex:1 1 0;font-size:10px}
.evgrid{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:16px;align-items:start}
.evside{display:flex;flex-direction:column;gap:16px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(330px,100%),1fr));gap:12px}
.dayblk{margin-bottom:22px}
.sc{padding:4px 6px 8px;display:flex;flex-direction:column;gap:3px}
.sc-r{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 10px;align-items:center;padding:7px 8px;min-height:50px;border-radius:12px;border:1px solid transparent;transition:background .18s,border-color .18s,opacity .2s}
.sc-r .nm{min-width:0;font-size:14px;line-height:1.25}
.sc-r .nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.sc-r .nm small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.sc-r .plc{grid-column:2 / -1;justify-self:start}
.sc-r.p1,.sc-r.win{background:var(--ok-bg);border-color:color-mix(in srgb,var(--ok) 38%,transparent)}
.final .sc-r.p1,.final .sc-r.win{background:var(--gold-bg);border-color:color-mix(in srgb,var(--gold) 45%,transparent)}
.sc-r.draw{background:var(--warn-bg)}
.sc-r.lose{opacity:.6}
.sc-r.dns{opacity:.55}
.sc-r.host:not(.p1) .nm small{font-style:italic}
.sc-r.dns .nm b,.sc-r.lose .nm b{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 60%,transparent)}
.sc-r.ph{color:var(--muted);font-style:italic}
.sc-r.ph .nm b{font-weight:500}
.sc-r.tracked{box-shadow:inset 3px 0 0 var(--track)}
.sc-r.tracked .nm b{color:var(--track)}
.plc{display:inline-flex;flex-wrap:wrap;gap:2px;padding:3px;border-radius:12px;background:var(--sunk);border:1px solid var(--stroke)}
.plc button{min-width:38px;height:32px;padding:0 8px;border:0;background:none;border-radius:9px;font:700 12.5px "Space Grotesk",sans-serif;color:var(--muted);transition:background .15s,color .15s,transform .12s}
.plc button:hover:not(:disabled){color:var(--fg);background:var(--glass-2)}
.plc button:active:not(:disabled){transform:scale(.92)}
.plc button[aria-pressed="true"]{background:var(--grad);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.plc button.g1[aria-pressed="true"]{background:var(--ok);color:var(--on-ok)}
.final .plc button.g1[aria-pressed="true"]{background:var(--gold);color:#2B1A00}
.plc button.dn[aria-pressed="true"]{background:var(--warn);color:#2B1A00}
.plc button:disabled{cursor:not-allowed;opacity:.45}
.kin{display:flex;align-items:center;gap:7px;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.kin input{width:60px;height:38px;border-radius:11px;border:1px solid var(--stroke);background:var(--sunk);text-align:center;font:700 15px "Space Grotesk",sans-serif;font-variant-numeric:tabular-nums;color:var(--fg);-moz-appearance:textfield;appearance:textfield;transition:border-color .2s,box-shadow .2s,background .2s}
.kin input::-webkit-inner-spin-button,.kin input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.kin input::placeholder{color:var(--muted);opacity:.6}
.kin input:focus{border-color:var(--primary);background:var(--glass-2);box-shadow:0 0 0 4px color-mix(in srgb,var(--primary) 18%,transparent)}
.kin input:disabled{opacity:.45;cursor:not-allowed}
.kin.big input{width:76px;height:48px;font-size:21px;border-radius:13px}
.mt .acts{display:flex;gap:6px;margin-left:auto}
.mt .acts .ib{color:var(--muted)}
.mt .acts .ib:hover{color:var(--fg)}
.mf.warns{display:flex;flex-direction:column;gap:5px;padding-top:2px}
.mf .w,.mf .i2{display:flex;gap:7px;align-items:flex-start;line-height:1.4}
.mf .w{color:var(--warn)}
.mf .w svg,.mf .i2 svg{width:14px;height:14px;margin-top:2px}
.league td:nth-child(2){max-width:0;width:100%}
.league td:nth-child(2) .tn{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.form{display:inline-flex!important;gap:3px}
.fp{width:19px;height:19px;border-radius:6px;display:grid;place-items:center;font:700 10.5px "Space Grotesk",sans-serif;background:var(--sunk);color:var(--muted);border:1px solid var(--stroke)}
.fp.f1{background:var(--ok);color:var(--on-ok);border-color:transparent}
.fp.f0{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.lact{padding:2px 12px 12px;display:flex;gap:8px;flex-wrap:wrap}
.lact .btn{min-height:40px;font-size:13.5px}
.top3{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;position:relative}
.top3 li{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;padding:6px 10px 6px 8px;border-radius:12px;background:var(--sunk)}
.top3 .rk{width:18px;text-align:center;font:700 13px "Space Grotesk",sans-serif;color:var(--muted)}
.top3 li:first-child .rk{color:var(--gold)}
.top3 .tn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top3 b{font:700 15px "Space Grotesk",sans-serif;font-variant-numeric:tabular-nums}
.top3 b small{font:600 11px "DM Sans",sans-serif;color:var(--muted);margin-left:2px}
.att{padding:18px 14px 12px}
.att h3{font-size:16px;display:flex;align-items:center;gap:9px;margin:0 6px 10px}
.att h3 svg{color:var(--cc,var(--primary))}
.att .upl a{grid-template-columns:62px 12px 1fr}
.att .none{color:var(--muted);font-size:14px;padding:4px 8px 8px}
.rules{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}
.rules h3{grid-column:1/-1;font-size:15px;color:var(--fg);margin-top:6px}
.rules label{display:flex;flex-direction:column;gap:6px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.rules input{height:44px;border-radius:12px;border:1px solid var(--stroke);background:var(--sunk);text-align:center;font:700 16px "Space Grotesk",sans-serif;color:var(--fg)}
.rules input:focus{border-color:var(--primary);box-shadow:0 0 0 4px color-mix(in srgb,var(--primary) 18%,transparent)}
.cpt{width:100%;min-height:260px;border-radius:12px;border:1px solid var(--stroke);background:var(--sunk);padding:12px;font:500 13px/1.5 ui-monospace,Consolas,monospace;color:var(--fg);resize:vertical}
/* The title never wraps; with six tabs (Challenger on) the labels give way to icons sooner to leave it room. */
@media (min-width:761px){
  .brand{flex-shrink:0}
  .brand b{white-space:nowrap}
}
@media (max-width:1380px) and (min-width:761px){
  nav.tabs:has(a:nth-child(6)) a{padding:8px 11px}
  nav.tabs:has(a:nth-child(6)) a span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
}
@media (max-width:1100px){
  .evgrid{grid-template-columns:1fr}
  nav.tabs a{padding:8px 11px}
  nav.tabs a span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
}
.subtabs .seg{max-width:100%;overflow-x:auto;scrollbar-width:none}
.subtabs .seg::-webkit-scrollbar{display:none}
.subtabs .seg button{white-space:nowrap;flex:none}
@media (max-width:760px){
  .att .upl a{grid-template-columns:56px 12px 1fr}
  .subtabs .seg button{padding:0 10px;gap:5px}
}
/* read-only board for spectators: show the result, not the entry controls */
.ro .plc button:disabled,.ro .kin input:disabled{opacity:1;cursor:default}
.ro .plc button:not([aria-pressed="true"]),.ro .plc:not(:has([aria-pressed="true"])),.ro .kin:has(input:placeholder-shown){display:none}
footer .net{display:inline-flex;align-items:center;gap:7px}
footer .net i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent)}
footer .net.off i{background:var(--warn);box-shadow:0 0 0 3px color-mix(in srgb,var(--warn) 25%,transparent)}
footer a{color:inherit}
a.mi{color:inherit;text-decoration:none}
</style>

<body>
<div class="aurora" aria-hidden="true"><i class="o1"></i><i class="o2"></i><i class="o3"></i><i class="grid"></i></div>
<a class="skip" href="#app">Skip to content</a>
<header class="top">
  <div class="wrap">
    <div class="bar glass">
      <a class="brand" href="#/" aria-label="COD Score Tracker home">
        <span class="brand-mark" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M22 12h-4M6 12H2M12 6V2M12 22v-4"/><circle cx="12" cy="12" r="2"/></svg></span>
        <span><b class="display">COD Showdown ’26</b><small>Game on for Charity · Nov 16 – 27</small></span>
      </a>
      <nav class="tabs" aria-label="Sections" id="tabs"></nav>
      <div class="spot" id="spot">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <label for="spotIn" class="sr">Search players or matches</label>
        <input id="spotIn" role="combobox" aria-expanded="false" aria-autocomplete="list" aria-haspopup="listbox" placeholder="Search players or matches" autocomplete="off" spellcheck="false">
        <kbd aria-hidden="true">/</kbd>
        <button class="ib sm clr" data-act="untrack" aria-label="Stop tracking player"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      </div>
      <button class="ib" data-act="theme" id="themeBtn" aria-label="Switch theme"></button>

const R0 = {place:[4,3,2,1], kill:0, ffaAdv:4, win:3, draw:1, loss:0, t2Adv:2};
const BOOT = window.COD_BOOT || {cod:null, edit:false};
const clone = o => JSON.parse(JSON.stringify(o));
// Line-up corrections made after results were saved: [match, saved under, belongs to].
// Harin and Prathibha swapped CODF-08 and CODF-12, so their saved places and kills move with them.
const MOVED = [['CODF-08', 'Harin Goonathilake', 'Prathibha Gayawansha'], ['CODF-12', 'Prathibha Gayawansha', 'Harin Goonathilake']];
function moveResults(r){
  MOVED.forEach(([id, from, to]) => {
    const x = r[id]; if (!x) return;
    ['pl', 'k'].forEach(f => { const o = x[f]; if (!o || !(from in o)) return; if (!(to in o)) o[to] = o[from]; delete o[from]; });
  });
  return r;
}
const pick = c => { const p = clone({r:(c && c.r) || {}, fin:(c && c.fin) || {}, rules:(c && c.rules) || {}}); moveResults(p.r); return p; };
let EDIT = !!BOOT.edit;
let BASE = pick(BOOT.cod); // the results the server last confirmed
let S = Object.assign(clone(BASE), {track:''});
try { S.track = localStorage.getItem('cod26-track') || ''; } catch(e) {}
// Player tracking stays in this browser; results go to GameON for everyone.
const save = () => { try { localStorage.setItem('cod26-track', S.track || ''); } catch(e) {} queueSync(); };
const UI = {f:'all', day:'all', sev:'all', hideDone:false, pq:''};
const RU = () => Object.assign({}, R0, S.rules || {}, {t2Adv:2}); // the 2v2 final is always head-to-head
let RR = RU(), CACHE = {};
function bust(){ CACHE = {}; RR = RU(); }

/* ---------------- Scoring engine ---------------- */
const ffaPts = (v,k) => v > 0 ? (+RR.place[v-1] || 0) + (+k || 0) * RR.kill : 0;
function ents(id){ const m = MI[id]; return m.final ? finalists(m.ev).names : m.p; }
function ffaDone(id, E){
  E = E || ents(id);
  const r = S.r[id];
  if (!r || !r.pl || !E.length) return false;
  const seen = new Set();
  for (const n of E){
    const v = r.pl[n];
    if (v === undefined) return false;
    if (v > 0){ if (seen.has(v)) return false; seen.add(v); }
  }
  return true;
}
function t2Res(id){
  const r = S.r[id];
  if (!r) return null;
  if (r.ff === 0 || r.ff === 1) return {w:1 - r.ff, ff:true};
  if (r.s && num(r.s[0]) && num(r.s[1])){ const a = +r.s[0], b = +r.s[1]; return {w:a > b ? 0 : b > a ? 1 : -1, a, b}; }
  return null;
}
const done = id => isLobby(id) ? ffaDone(id) : !!t2Res(id);

// FFA and Challenger tables score the same way. Only the event's own roster is ranked, so hosts in
// Challenger lobbies (who are FFA players) get nothing from those games on either table.
function ffaTable(ev = 'ffa'){
  const by = {}, roster = ev === 'ch' ? D.ch : D.ffa;
  const rows = roster.map(n => by[n] = {n, p:0, w:0, k:0, pts:0, dns:0, form:[]});
  let dn = 0;
  IDS[ev].forEach(id => {
    const m = MI[id];
    if (!ffaDone(id, m.p)) return;
    dn++;
    const r = S.r[id];
    m.p.forEach(n => {
      const o = by[n]; if (!o) return;
      const v = r.pl[n];
      o.p++; o.form.push(v);
      if (v === 0){ o.dns++; return; }
      const k = +(r.k || {})[n] || 0;
      o.k += k; o.pts += ffaPts(v, k); if (v === 1) o.w++;
    });
  });
  rows.sort((a,b) => b.pts - a.pts || b.w - a.w || b.k - a.k || a.n.localeCompare(b.n));
  const adv = Math.min(ev === 'ch' ? 1 : RR.ffaAdv, rows.length);
  const same = (a,b) => a && b && a.pts === b.pts && a.w === b.w && a.k === b.k;
  return {rows, adv, done:dn, total:IDS[ev].length, complete:dn === IDS[ev].length, tie:dn > 0 && same(rows[adv-1], rows[adv])};
}
function t2Table(){
  const by = {};
  const rows = D.teams.map(n => by[n] = {n, p:0, w:0, d:0, l:0, sf:0, sa:0, pts:0, form:[]});
  let dn = 0;
  IDS.t2.forEach(id => {
    const m = MI[id], x = t2Res(id);
    if (!x) return;
    dn++;
    m.p.forEach((n,i) => {
      const o = by[n]; if (!o) return;
      o.p++;
      if (!x.ff){ o.sf += i ? x.b : x.a; o.sa += i ? x.a : x.b; }
      if (x.w === -1){ o.d++; o.pts += RR.draw; o.form.push('D'); }
      else if (x.w === i){ o.w++; o.pts += RR.win; o.form.push('W'); }
      else { o.l++; o.pts += RR.loss; o.form.push('L'); }
    });
  });
  rows.sort((a,b) => b.pts - a.pts || (b.sf - b.sa) - (a.sf - a.sa) || b.sf - a.sf || a.n.localeCompare(b.n));
  const adv = Math.min(RR.t2Adv, rows.length);
  const same = (a,b) => a && b && a.pts === b.pts && (a.sf - a.sa) === (b.sf - b.sa) && a.sf === b.sf;
  return {rows, adv, done:dn, total:IDS.t2.length, complete:dn === IDS.t2.length, tie:dn > 0 && same(rows[adv-1], rows[adv])};
}
const table = ev => CACHE[ev] || (CACHE[ev] = lobby(ev) ? ffaTable(ev) : t2Table());
const rankOf = (ev, n) => table(ev).rows.findIndex(r => r.n === n) + 1;
const rankTxt = (ev, n) => table(ev).done ? `${{ffa:'Leaderboard', ch:'Challenger'}[ev] || 'Table'} #${rankOf(ev, n)}` : 'Not ranked yet';
// The play-in is a head-to-head between the FFA leaderboard's last qualifier and the Challenger #1.
function playIn(){
  const F = table('ffa'), C = table('ch'), a = F.done ? F.rows[F.adv-1] : null, b = C.done ? C.rows[0] : null;
  const T = {adv:2, done:F.done + C.done, total:F.total + C.total, complete:F.complete && C.complete, tie:F.tie || C.tie};
  return {names:a && b ? [a.n, b.n] : [], T};
}
function finalists(ev){
  if (ev === 'ch'){
    const P = playIn();
    if (S.fin && S.fin.ch) return {names:S.fin.ch, locked:true, prov:false, T:P.T};
    return {names:P.names, locked:false, prov:!P.T.complete || P.T.tie, T:P.T};
  }
  const T = table(ev);
  if (S.fin && S.fin[ev]) return {names:S.fin[ev], locked:true, prov:false, T};
  const top = T.done ? T.rows.slice(0, T.adv).map(r => r.n) : [];
  if (ev !== 'ffa' || !CHON) return {names:top, locked:false, prov:!T.complete || T.tie, T};
  // With a Challenger group the last seat goes to the play-in winner, so it stays open until that is played.
  const w = champion('ch');
  return {names:w ? [...top.slice(0, -1), w] : top.slice(0, -1), locked:false, prov:!T.complete || T.tie || !w, T, wait:!w};
}
function champion(ev){
  const F = finalists(ev), id = EV[ev].fid;
  if (F.prov || !F.names.length) return null;
  if (ev === 'ffa'){ if (!ffaDone(id, F.names)) return null; return F.names.find(n => S.r[id].pl[n] === 1) || null; }
  const x = t2Res(id);
  return x && x.w >= 0 ? F.names[x.w] : null;
}
function status(id){
  const m = MI[id];
  if (m.final && m.ev === 'ch') return champion('ch') ? {k:'done', t:'Done', i:'check'} : {k:'', t:'Game Night'};
  if (m.final) return champion(m.ev) ? {k:'gold', t:'Crowned', i:'crown'} : {k:'', t:'Game Night'};
  if (done(id)) return {k:'done', t:'Done', i:'check'};
  const now = NOW(), w = m.w;
  if (now >= w.start && now <= w.end) return {k:'live', t:'Live'};
  if (now > w.end) return {k:'warn', t:'Needs result', i:'alert'};
  if (sameDay(now, w.start)) return {k:'today', t:'Today'};
  return {k:'', t:'Upcoming'};
}
const pill = s => `<span class="pill ${s.k}">${s.i ? ic(s.i) : ''}${esc(s.t)}</span>`;
function warns(m){
  if (m.final) return [];
  const o = [];
  const off = people(m).filter(n => D.prio[n] && !D.prio[n].includes(m.w.dow));
  if (off.length) o.push({w:true, t:`Off priority day: ${off.map(n => `${first(n)} (${D.prio[n].join('/')})`).join(', ')}`});
  const x = XB[m.id];
  if (x) o.push({w:true, t:`${x[0].map(first).join(' & ')} ${x[0].length > 1 ? 'have' : 'has'} ${x[1]} in the Lunchroom at ${h12(x[2])} PM, straight after`});
  const nx = MATCHES.find(n => n.id !== m.id && n.date === m.date && n.s === m.e);
  if (nx){ const sh = people(m).filter(p => people(nx).includes(p)); if (sh.length) o.push({w:false, t:`${sh.map(first).join(' & ')} also play${sh.length > 1 ? '' : 's'} ${nx.id} straight after, here`}); }
  return o;
}
function resText(id){
  const E = ents(id);
  if (isLobby(id)){
    if (!ffaDone(id)) return '';
    const r = S.r[id], w = E.find(n => r.pl[n] === 1);
    if (!w) return 'Void: no-shows';
    const k = +(r.k || {})[w] || 0;
    return `Won by ${first(w)}${k ? ` · ${k} kill${k === 1 ? '' : 's'}` : ''}`;
  }
  const x = t2Res(id); if (!x) return '';
  const wins = x.w >= 0 && !E[x.w].includes(' & ') ? 'wins' : 'win';
  if (x.ff) return `${tShort(E[x.w])} ${wins} by forfeit`;
  if (x.w === -1) return `Draw ${x.a}–${x.b}`;
  return `${tShort(E[x.w])} ${wins} ${Math.max(x.a, x.b)}–${Math.min(x.a, x.b)}`;
}
function myRes(m, n){
  if (lobby(m.ev)){
    const others = m.p.filter(x => x !== n).map(first).join(', '), host = isHost(m, n);
    if (!ffaDone(m.id)) return `${host ? 'Hosting · ' : ''}vs ${others}`;
    const r = S.r[m.id], v = r.pl[n], k = +(r.k || {})[n] || 0;
    if (host) return `Hosted · ${v === 0 ? 'no-show' : ORD[v]} · not counted`;
    return v === 0 ? 'No-show · 0 pts' : `${ORD[v]} · ${k} kill${k === 1 ? '' : 's'} · ${ffaPts(v, k)} pts`;
  }
  const t = teamOf(n), i = m.p.indexOf(t), opp = m.p[1-i], x = t2Res(m.id);
  if (!x) return `With ${first(t.split(' & ').find(y => y !== n))} vs ${tShort(opp)}`;
  if (x.ff) return `${x.w === i ? 'Won by forfeit' : 'Forfeited'} vs ${tShort(opp)}`;
  const me = i ? x.b : x.a, them = i ? x.a : x.b;
  return `${x.w === -1 ? 'Drew' : x.w === i ? 'Won' : 'Lost'} ${me}–${them} vs ${tShort(opp)}`;
}

try { Object.assign(PREF, JSON.parse(localStorage.getItem('cod26-prefs')) || {}); } catch(e) {}
const savePref = () => { try { localStorage.setItem('cod26-prefs', JSON.stringify(PREF)); } catch(e) {} };

const avHue = n => { let h = 0; for (const c of n) h = (h*31 + c.charCodeAt(0)) % 360; return h; };
const initials = n => { const t = n.split(' ').filter(Boolean); return ((t[0]||'')[0] || '') + (t.length > 1 ? t[t.length-1][0] : ''); };
const av = (n, cls='') => `<span class="av ${cls}" style="--h:${avHue(n)}" aria-hidden="true">${esc(initials(n).toUpperCase())}</span>`;
const avs = side => `<span class="avs">${side.split(' & ').map(n => av(n)).join('')}</span>`;

const fchip = v => `<span class="fp ${v === 1 ? 'f1' : v === 0 ? 'f0' : ''}" title="${ORD[v]}">${v === 0 ? '–' : v}</span>`;

/* spotlight search */
const popEl = $('pop'), spotIn = $('spotIn');
let POP = null;
function spotItems(q){
  q = q.trim().toLowerCase();
  const it = [];
  PLAYERS.filter(p => !q || p.n.toLowerCase().includes(q)).slice(0, q ? 8 : 5).forEach(p => it.push({k:'p', v:p.n, l:p.n, s:[p.ffa ? 'FFA' : '', p.team ? '2v2 · ' + tShort(p.team) : '', p.ch ? 'Challenger' : ''].filter(Boolean).join(' · '), lead:av(p.n)}));
  if (q) MATCHES.filter(m => m.id.toLowerCase().includes(q)).slice(0, 6).forEach(m => it.push({k:'m', v:m.id, l:`${m.id} · ${EV[m.ev].short}`, s:fmtShort(m.w), lead:oi(EV[m.ev].icon, EV[m.ev].cc)}));
  return it;
}
function openSpot(){
  const q = spotIn.value === S.track ? '' : spotIn.value;
  POP = {items:spotItems(q), idx:0, q};
  drawPop();
  if (popEl.hidden){ popEl.hidden = false; requestAnimationFrame(() => popEl.classList.add('open')); }
  placePop(); spotIn.setAttribute('aria-expanded', 'true');
}
function drawPop(){
  const its = POP.items;
  if (!its.length){ popEl.innerHTML = `<div class="pop-empty">No players or matches match “${esc(POP.q)}”.</div>`; spotIn.removeAttribute('aria-activedescendant'); return; }
  let h = '', g = '';
  its.forEach((o,i) => {
    if (o.k !== g){ g = o.k; h += `<div class="pop-g">${g === 'p' ? 'Players · pick one to track' : 'Matches'}</div>`; }
    h += `<div class="opt ${i === POP.idx ? 'act' : ''} ${o.k === 'p' && o.v === S.track ? 'sel' : ''}" role="option" id="opt-${i}" data-i="${i}" aria-selected="${i === POP.idx}">${o.lead}<span class="opt-t"><b>${esc(o.l)}</b><small>${esc(o.s)}</small></span>${o.k === 'p' && o.v === S.track ? ic('check','i tick') : ''}</div>`;
  });
  popEl.innerHTML = `<div role="listbox" id="spotList" aria-label="Search results">${h}</div>`;
  spotIn.setAttribute('aria-controls', 'spotList'); spotIn.setAttribute('aria-activedescendant', 'opt-' + POP.idx);
}
function placePop(){
  if (!POP) return;
  const r = $('spot').getBoundingClientRect(), w = Math.min(Math.max(r.width, 320), innerWidth - 16);
  popEl.style.width = w + 'px';
  popEl.style.left = Math.max(8, Math.min(r.left, innerWidth - w - 8)) + 'px';
  popEl.style.top = (r.bottom + 8) + 'px';
  popEl.style.maxHeight = Math.max(200, innerHeight - r.bottom - 24) + 'px';
}
function closePop(){
  if (!POP) return;
  POP = null; popEl.classList.remove('open'); popEl.hidden = true; popEl.innerHTML = '';
  spotIn.setAttribute('aria-expanded', 'false'); spotIn.removeAttribute('aria-activedescendant');
}
function movePop(d){
  if (!POP || !POP.items.length) return;
  POP.idx = (POP.idx + d + POP.items.length) % POP.items.length; drawPop();
  const el = $('opt-' + POP.idx); if (el) el.scrollIntoView({block:'nearest'});
}
function pickPop(i){
  const o = POP && POP.items[i]; if (!o) return;
  closePop(); spotIn.blur();
  if (o.k === 'p') setTrack(o.v === S.track ? '' : o.v);
  else { syncSpot(); location.hash = `#/${EV[MI[o.v].ev].path}?m=${o.v}`; }
}
function setTrack(n){ S.track = n; save(); syncSpot(); render(true); toast(n ? `Tracking ${n}` : 'Stopped tracking'); }
function syncSpot(){ $('spot').classList.toggle('on', !!S.track); if (document.activeElement !== spotIn) spotIn.value = S.track || ''; }

/* menu */
const menuEl = $('menuPop'), menuBtn = $('menuBtn');
function drawMenu(){
  const anim = `<button class="mi" role="menuitemcheckbox" aria-checked="${!!PREF.anim}" data-act="anim">${ic('party')}Animated backdrop<span class="sw-track"><span class="sw-thumb"></span></span></button>`;

  menuEl.innerHTML = EDIT ? `<button class="mi" role="menuitem" data-act="rules">${ic('sliders')}Scoring rules</button>
    <button class="mi" role="menuitem" data-act="copy">${ic('copy')}Copy standings</button>${rulesLink}<hr>
    <button class="mi" role="menuitem" data-act="export">${ic('down')}Export results</button>
    <button class="mi" role="menuitem" data-act="import">${ic('up')}Import results</button><hr>
    ${anim}<hr>
    <button class="mi danger" role="menuitem" data-act="reset">${ic('reset')}Reset all results</button>`
  : `<button class="mi" role="menuitem" data-act="copy">${ic('copy')}Copy standings</button>${rulesLink}<hr>${anim}<hr>
    <a class="mi" role="menuitem" href="/admin">${ic('lock')}Organiser sign-in</a>`;

function toggleMenu(open, refocus){
  const want = open === undefined ? menuEl.hidden : open;
  if (want){
    closePop(); drawMenu(); menuEl.hidden = false;
    const r = menuBtn.getBoundingClientRect();
    menuEl.style.top = (r.bottom + 10) + 'px'; menuEl.style.left = Math.max(8, r.right - 270) + 'px';
    requestAnimationFrame(() => menuEl.classList.add('open'));
  }
  else { menuEl.classList.remove('open'); menuEl.hidden = true; if (refocus) menuBtn.focus(); }
  menuBtn.setAttribute('aria-expanded', String(want));
}

/* modal */
let MODAL = null;
function openModal({title, sub, lead, icon, tone, html, actions = []}){
  closePop(); toggleMenu(false);
  const m = $('modal');
  MODAL = {prev:document.activeElement, actions};
  m.innerHTML = `<div class="scrim" data-act="modal-x"></div>
    <div class="dialog glass" role="dialog" aria-modal="true" aria-labelledby="mTitle" tabindex="-1">
      <button class="ib sm mx" data-act="modal-x" aria-label="Close dialog">${ic('x')}</button>
      <div class="dh">${lead || (icon ? `<span class="dicon ${tone||''}">${ic(icon)}</span>` : '')}<div><h2 id="mTitle" class="display">${esc(title)}</h2>${sub ? `<p>${sub}</p>` : ''}</div></div>
      ${html ? `<div class="db">${html}</div>` : ''}
      ${actions.length ? `<div class="df">${actions.map((a,i) => `<button class="btn ${a.cls||''}" data-act="modal-a" data-i="${i}" ${a.focus ? 'data-focus' : ''}>${a.icon ? ic(a.icon) : ''}${esc(a.label)}</button>`).join('')}</div>` : ''}
    </div>`;
  m.hidden = false; document.documentElement.classList.add('lock');
  requestAnimationFrame(() => { if (!MODAL) return; m.classList.add('open'); const f = m.querySelector('.df .btn[data-focus]') || m.querySelector('.df .btn:last-child') || m.querySelector('.dialog'); if (f) f.focus(); });
}
function closeModal(restore = true){
  if (!MODAL) return;
  const prev = MODAL.prev; MODAL = null;
  const m = $('modal'); m.classList.remove('open'); m.hidden = true; m.innerHTML = '';
  document.documentElement.classList.remove('lock');
  if (restore && prev && document.contains(prev)) prev.focus({preventScroll:true});
  if (paintLater) setTimeout(paint, 0); // results that arrived while the dialog was open
}

/* toast + confetti */

  t.innerHTML = `${ic(warn ? 'alert' : 'check')}<span>${esc(msg)}</span>`;
  requestAnimationFrame(() => t.classList.add('show'));
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600);
}

  if (reduced()) return;

/* ---------------- Cards ---------------- */
const ghost = (b, s) => `<div class="sc-r ph"><span class="av ghost">?</span><span class="nm"><b>${b}</b><small>${s}</small></span></div>`;
function rowsFFA(id, E, lock){
  const m = MI[id], fin = !!m.final;
  // With a Challenger group the Grand Final's last seat waits for the play-in.
  const seat = fin && m.ev === 'ffa' && finalists('ffa').wait ? ghost('Play-in winner', 'Wildcard play-in') : '';
  if (!E.length) return `<div class="sc">${Array.from({length:RR.ffaAdv - (seat ? 1 : 0)}, (_,i) => ghost('To be decided', `Leaderboard #${i+1}`)).join('')}${seat}</div>`;
  const r = S.r[id] || {}, pl = r.pl || {}, kk = r.k || {};
  return `<div class="sc">${E.map((n,i) => {
    const v = pl[n], k = kk[n], p = ffaPts(v, k), host = isHost(m, n);
    const sub = host ? (v === 0 ? 'Host · no-show' : v ? `Host · ${ORD[v]} · not counted` : 'Host · not counted')
      : v === 0 ? 'No-show · 0 pts' : v ? (fin ? `Finished ${ORD[v]}` : `${ORD[v]} · ${plural(p, 'pt')}`) : fin ? `Seed ${i+1}` : rankTxt(m.ev, n);
    const bt = (val, lab, cls, aria) => `<button class="${cls}" data-act="pl" data-id="${id}" data-n="${esc(n)}" data-v="${val}" aria-pressed="${v === val}" aria-label="${esc(aria)}" ${lock ? 'disabled' : ''}>${lab}</button>`;

const WRITES = new Set(['pl', 'clear', 'ff', 'lock', 'unlock', 'rules', 'import', 'reset']);
const eq = (a, b) => JSON.stringify(a ?? null) === JSON.stringify(b ?? null);
const editing = () => { const a = document.activeElement; return !!(a && a.matches && a.matches('input[data-k],input[data-s]')); };
// Local edits the server has not confirmed yet, as one change per match, final line-up or rule set.
function pending(){
  if (!EDIT) return [];
  const ch = [], fin = S.fin || {};
  new Set([...Object.keys(S.r), ...Object.keys(BASE.r)]).forEach(id => { if (!eq(S.r[id], BASE.r[id])) ch.push({op:'result', id, value:S.r[id] || null}); });
  ['ffa', 't2', 'ch'].forEach(ev => { if (!eq(fin[ev], BASE.fin[ev])) ch.push({op:'finalists', ev, names:fin[ev] || null}); });
  if (!eq(S.rules || {}, BASE.rules)) ch.push({op:'rules', rules:S.rules || {}});
  return ch;
}
// Take the server's results but keep anything this organiser changed and has not saved yet.
function adopt(cod){
  const mine = pending(), track = S.track;
  BASE = pick(cod);
  S = Object.assign(clone(BASE), {track});
  mine.forEach(c => {
    if (c.op === 'result'){ if (c.value) S.r[c.id] = c.value; else delete S.r[c.id]; }
    else if (c.op === 'finalists'){ if (c.names) S.fin[c.ev] = c.names; else delete S.fin[c.ev]; }
    else S.rules = c.rules;
  });
}
let paintLater = false;
